services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: classmate
      POSTGRES_USER: classmate
      POSTGRES_PASSWORD: classmate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classmate -d classmate"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 2s

    ports:
      - "5432:5432"
    volumes:
      - classmate_db:/var/lib/postgresql/data

  pilot_api:
    build:
      context: ./services/pilot_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./services/pilot_api/.env
    environment:
      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      # DB / app (keep your existing app reading these if needed)
      DATABASE_URL: ${DATABASE_URL:-postgresql://classmate:classmate@db:5432/classmate?schema=public}
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: "dev-super-secret-change-me"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch(\'http://localhost:3000/api/health\').then(r=>r.json()).then(j=>process.exit(j&&j.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

volumes:
  classmate_db:
