name: CI

# Temporarily paused — workflow fails on Prisma/seed setup and was
# spamming the owner's inbox on every push. Re-enable when we're
# actually iterating on tests by restoring the push/PR triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  # pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d classmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classmate_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm --version

      - name: Install deps
        run: pnpm -r install --frozen-lockfile

      - name: Allow pnpm build scripts + rebuild
        run: |
          pnpm config set ignore-scripts false
          pnpm -r rebuild

      - name: Prisma generate (api)
        run: pnpm -C services/api exec prisma generate

      - name: Prisma db push (api)
        run: pnpm -C services/api exec prisma db push

      - name: Prisma seed (api)
        run: pnpm -C services/api exec prisma db seed

      - name: Run health checks
        run: |
          chmod +x ./scripts/health.sh
          ./scripts/health.sh
