name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      DATABASE_URL: file:./ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm --version

      - name: Install deps (workspace)
        run: pnpm -r install --frozen-lockfile

      - name: Allow pnpm build scripts + rebuild
        run: |
          pnpm config set ignore-scripts false
          pnpm -r rebuild


      # If health.sh uses Playwright, browsers + deps must exist in CI
      - name: Install Playwright browsers
        run: pnpm -C apps/admin-web exec playwright install --with-deps


      - name: Prisma db push (api)
        run: pnpm -C services/api exec prisma db push
      - name: Prisma generate (api)
        run: pnpm -C services/api exec prisma generate
      - name: Run full health checks (API + admin-web e2e)
        run: |
          chmod +x ./scripts/health.sh
          ./scripts/health.sh

      - name: Upload Playwright artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/admin-web/test-results
            apps/admin-web/playwright-report
