name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d classmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classmate_test
      # Guards only honor the dev bypass with this flag set (auth/dev-bypass.ts).
      # Tests authenticate with real JWTs; this preserves the historical
      # "test env = role checks relaxed" behavior.
      DEV_AUTH_BYPASS: "1"
      JWT_SECRET: ci-test-jwt-secret-not-used-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm --version

      - name: Install deps
        run: pnpm -r install --frozen-lockfile

      - name: Allow pnpm build scripts + rebuild
        run: |
          pnpm config set ignore-scripts false
          pnpm -r rebuild

      - name: Prisma generate (api)
        run: pnpm -C services/api exec prisma generate

      - name: Prisma db push (api)
        run: pnpm -C services/api exec prisma db push

      # Seeding has been the flaky step that paused this workflow — keep it
      # best-effort so a seed hiccup never red-Xes the whole run / spams the
      # owner. The Jest steps below are the real gate.
      - name: Prisma seed (api)
        continue-on-error: true
        run: pnpm -C services/api exec prisma db seed

      # Unit suite — fast, no app bootstrap. Uses the CI DATABASE_URL directly
      # (not .env.test), so invoke jest rather than the .env.test-coupled script.
      - name: Unit tests (api)
        working-directory: services/api
        run: pnpm exec jest -c jest.config.cjs --ci --testPathIgnorePatterns='e2e\.spec\.ts$'

      # Integration / security specs (src/test/*.e2e.spec.ts) — these were
      # orphaned by naming: ignored by `test` and not matched by the e2e config.
      # They cover join-code school-scope, validation pipe, parent-link, etc.
      - name: Integration tests (api)
        working-directory: services/api
        run: pnpm exec jest -c jest.config.cjs --ci --testMatch '**/src/**/*.e2e.spec.ts'

      # Full HTTP e2e suite (test/*.e2e-spec.ts) — best-effort for now; it has
      # heavier bootstrap/.env coupling. Promote to a hard gate once stable.
      - name: E2E tests (api)
        continue-on-error: true
        working-directory: services/api
        run: pnpm exec jest --config ./test/jest-e2e.json --ci

      - name: Run health checks
        run: |
          chmod +x ./scripts/health.sh
          ./scripts/health.sh
