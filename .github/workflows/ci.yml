name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install deps
        run: pnpm -r install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: API unit tests
        run: pnpm -C services/api test

      - name: Install Playwright browsers
        run: pnpm -C apps/admin-web exec playwright install --with-deps

      - name: Start API
        run: |
          pnpm -C services/api start:dev > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Start admin-web
        run: |
          pnpm -C apps/admin-web dev --port 3001 > /tmp/admin.log 2>&1 &
          echo $! > /tmp/admin.pid

      - name: Wait for servers
        run: |
          node -e "const http=require('http'); const urls=['http://localhost:3001','http://localhost:3001/api/health']; let tries=0; (function tick(){tries++; Promise.all(urls.map(u=>new Promise((res,rej)=>{const r=http.get(u,resp=>{resp.resume(); res(resp.statusCode)}); r.on('error',rej);}))).then(()=>process.exit(0)).catch(()=>{ if(tries>60){console.error('servers not ready'); process.exit(1)} setTimeout(tick,1000);});})()"

      - name: Admin-web e2e
        run: pnpm -C apps/admin-web exec playwright test --timeout=60000 --reporter=line

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          if-no-files-found: ignore
          path: |
            /tmp/api.log
            /tmp/admin.log
