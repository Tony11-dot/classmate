name: Ship

# One-tap release pipeline — trigger from the GitHub mobile app:
#   Actions → Ship → Run workflow → pick a branch + toggle targets → Run.
#
# Each target reuses the exact fastlane lanes in
# apps/classmate_mobile/fastlane/Fastfile, so CI and a local Mac build
# identically. iOS runs on a macOS runner (the only place Xcode exists);
# Android/Web/Railway run on Linux. Secrets live in GitHub (Settings →
# Secrets and variables → Actions), never in the repo — see docs/CI_SHIPPING.md.

on:
  workflow_dispatch:
    inputs:
      android:
        description: "Android → Play"
        type: boolean
        default: true
      android_track:
        description: "Play track"
        type: choice
        options: [internal, closed, production]
        default: internal
      ios:
        description: "iOS → TestFlight"
        type: boolean
        default: true
      web:
        description: "Web → Firebase Hosting"
        type: boolean
        default: true
      railway:
        description: "Backend → Railway (only if backend changed)"
        type: boolean
        default: false

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

env:
  # Matches the --dart-define baked into the fastlane mobile builds.
  CM_API_BASE_URL: https://pacific-enchantment-production-7a80.up.railway.app
  MOBILE_DIR: apps/classmate_mobile

jobs:
  # ── Gate: the ship only proceeds if the app analyzes clean ──────────────────
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: ${{ env.MOBILE_DIR }}
        run: flutter pub get
      - name: flutter analyze (errors/warnings block; info lints OK)
        working-directory: ${{ env.MOBILE_DIR }}
        run: flutter analyze lib --no-fatal-infos

  # ── Android → Google Play ───────────────────────────────────────────────────
  android:
    needs: preflight
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ env.MOBILE_DIR }}

      - name: Restore Android signing key.properties + keystore
        working-directory: ${{ env.MOBILE_DIR }}/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Restore Play service account
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_JSON" > fastlane/play-service-account.json

      - name: fastlane android ${{ inputs.android_track }}
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bundle exec fastlane android ${{ inputs.android_track }}

      - name: Cleanup secrets on disk
        if: always()
        working-directory: ${{ env.MOBILE_DIR }}
        run: rm -f android/upload-keystore.jks android/key.properties fastlane/play-service-account.json

  # ── iOS → TestFlight (macOS runner — the only place Xcode exists) ────────────
  ios:
    needs: preflight
    if: ${{ inputs.ios }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ env.MOBILE_DIR }}

      - name: flutter pub get
        working-directory: ${{ env.MOBILE_DIR }}
        run: flutter pub get

      # Import the existing Apple Distribution cert (.p12) into a temporary
      # keychain. Reuses your current cert instead of minting a new one each
      # run (Apple caps distribution certs at ~2/account).
      - name: Import code-signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install "ClassMate AppStore" provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d > \
            "$HOME/Library/MobileDevice/Provisioning Profiles/ClassMate_AppStore.mobileprovision"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$HOME/private_keys/AuthKey.p8"

      - name: fastlane ios beta
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Fastfile reads ASC_KEY_PATH and File.expand_path's it.
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey.p8"
          bundle exec fastlane ios beta

  # ── Web → Firebase Hosting ──────────────────────────────────────────────────
  web:
    needs: preflight
    if: ${{ inputs.web }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          flutter pub get
          flutter build web --release --dart-define=CM_API_BASE_URL=$CM_API_BASE_URL

      - name: Write Firebase service account
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy to Firebase Hosting
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npm i -g firebase-tools
          firebase deploy --only hosting --project classmate-f17d6 --non-interactive

      - name: Cleanup secrets on disk
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

  # ── Backend → Railway (opt-in; backend is usually unchanged) ─────────────────
  railway:
    needs: preflight
    if: ${{ inputs.railway }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          # Runs from repo root; .railwayignore excludes **/build/ to avoid 413.
          railway up --detach
      - name: Health check
        run: curl -sf "$CM_API_BASE_URL/health"
