name: E2E (admin-web)

concurrency:
  group: e2e-admin-web-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # nightly

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classmate_test
      E2E_API_BASE_URL: http://127.0.0.1:3000
      PORT: 3000
      API: http://127.0.0.1:3000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: |
          for i in {1..90}; do
            curl -fsS http://127.0.0.1:3000/api/test/seed/admin-web -X POST -H 'content-type: application/json' -d '{}' >/dev/null && exit 0 || true
            sleep 1
          done
          echo "API did not become reachable on :3000" >&2
          exit 1

      - run: pnpm -C apps/admin-web exec playwright install --with-deps
      - run: pnpm -C apps/admin-web exec playwright test
