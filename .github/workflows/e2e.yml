name: E2E (admin-web)

concurrency:
  group: e2e-admin-web-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # nightly

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classmate_test
      # Playwright e2e reads this (defaults to 3001/3002 otherwise)
      E2E_API_BASE_URL: http://127.0.0.1:3000
      WEB_BASE: http://127.0.0.1:3001
      # Ensure Nest binds where we expect
      PORT: 3000

      JWT_SECRET: test_jwt_secret_for_ci_only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate

      - run: pnpm -r install --frozen-lockfile

      - run: pnpm -C services/api exec prisma generate
      - run: pnpm -C services/api exec prisma db push
      - run: pnpm -C services/api exec prisma db seed

      - run: |
          export PORT=3000
          # Start API and capture logs so we can debug crashes/binding issues
          (pnpm -C services/api start 2>&1 | tee api.log) &
          echo $! > api.pid
      - run: |
          set -euo pipefail
          for i in {1..120}; do
            curl -fsS http://127.0.0.1:3000/api/test/seed/admin-web \
              -X POST -H 'content-type: application/json' -d '{}' >/dev/null && exit 0 || true
            sleep 1
          done
          echo "API did not become reachable on :3000" >&2
          echo "--- ss -ltnp (ports) ---" >&2
          ss -ltnp || true
          echo "--- api.log (last 300 lines) ---" >&2
          tail -n 300 api.log || true
          echo "--- node processes ---" >&2
          ps aux | grep -E "node|nest|services/api" || true
          exit 1
      - run: |
          export PORT=3001
          # Start admin-web and capture logs
          (pnpm -C apps/admin-web dev 2>&1 | tee admin-web.log) &
          echo $! > admin-web.pid

      - run: |
          set -euo pipefail
          for i in {1..120}; do
            curl -fsS http://127.0.0.1:3001/ >/dev/null && exit 0 || true
            sleep 1
          done
          echo "admin-web did not become reachable on :3001" >&2
          echo "--- ss -ltnp (ports) ---" >&2
          ss -ltnp || true
          echo "--- admin-web.log (last 300 lines) ---" >&2
          tail -n 300 admin-web.log || true
          echo "--- node processes ---" >&2
          ps aux | grep -E "node|next|vite|admin-web" || true
          exit 1

      - run: pnpm -C apps/admin-web exec playwright install --with-deps
      - run: pnpm -C apps/admin-web exec playwright test
