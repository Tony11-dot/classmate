# Heap must fit the CI runner: GitHub ubuntu-latest has only ~7 GB RAM, so the
# old -Xmx8G let Gradle grow past physical memory during the obfuscated release
# build (Dart obfuscate + R8 + split-debug-info), and the OS OOM-killed the
# runner ~16 min in ("runner received shutdown signal"). 4 GB is ample for
# Gradle/R8 and leaves headroom for the Flutter/Dart subprocess + OS.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
