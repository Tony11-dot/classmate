<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ClassMate — Your Smart School Companion.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ClassMate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=cm4">

  <!-- Favicon (CM mark). A real favicon.ico is shipped so the browser's
       hard-coded /favicon.ico fallback (which Firebase's SPA rewrite would
       otherwise answer with index.html) resolves to the CM mark, not a stale
       cached Flutter icon. ?v= busts the path-keyed favicon cache. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=cm4" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png?v=cm4">
  <link rel="shortcut icon" href="favicon.ico?v=cm4">

  <title>ClassMate — Your Smart School Companion</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #FFFFFF;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <!-- TEMP diagnostic: surface any startup error on-screen (no DevTools needed). -->
  <script>
    (function () {
      function show(msg) {
        var d = document.getElementById('cm-err');
        if (!d) {
          d = document.createElement('pre');
          d.id = 'cm-err';
          d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;margin:0;padding:16px;background:#fff;color:#b00020;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto;';
          (document.body || document.documentElement).appendChild(d);
          var h = document.createElement('div');
          h.textContent = 'ClassMate web startup error — screenshot this:';
          h.style.cssText = 'font-weight:700;margin-bottom:10px;color:#111';
          d.appendChild(h);
        }
        var line = document.createElement('div');
        line.textContent = msg;
        line.style.marginBottom = '10px';
        d.appendChild(line);
      }
      window.addEventListener('error', function (e) {
        show('[error] ' + (e.message || '') + '\n' + (((e.error && e.error.stack) || (e.filename + ':' + e.lineno + ':' + e.colno)) || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('[promise] ' + ((r && (r.stack || r.message)) || String(r)));
      });
      window.__cmShowError = show;
    })();
  </script>

  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
