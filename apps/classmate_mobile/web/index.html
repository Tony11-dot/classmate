<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ClassMate — Your Smart School Companion.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ClassMate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=cm5">

  <!-- Favicon (CM mark). A real favicon.ico is shipped so the browser's
       hard-coded /favicon.ico fallback (which Firebase's SPA rewrite would
       otherwise answer with index.html) resolves to the CM mark, not a stale
       cached Flutter icon. ?v= busts the path-keyed favicon cache. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=cm5" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png?v=cm5">
  <link rel="shortcut icon" href="favicon.ico?v=cm5">

  <title>ClassMate — Your Smart School Companion</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #FFFFFF;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <!-- Startup errors: if Flutter can't boot, say so plainly (with Reload) and
       keep the technical details one tap away for a support screenshot. -->
  <script>
    (function () {
      function panel() {
        var d = document.getElementById('cm-err');
        if (d) return d;
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var bg = dark ? '#0b1020' : '#f3f5fb', card = dark ? '#121a30' : '#fff',
            ink = dark ? '#edf1fc' : '#0e1630', muted = dark ? '#9aa5c4' : '#5d6784',
            brand = dark ? '#83b5fe' : '#0b2398', brandInk = dark ? '#071447' : '#fff';
        d = document.createElement('div');
        d.id = 'cm-err';
        d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:16px;background:' + bg + ';font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:' + muted;
        d.innerHTML =
          '<div style="box-sizing:border-box;width:100%;min-width:0;max-width:420px;background:' + card + ';border-radius:22px;padding:28px 24px;box-shadow:0 18px 40px -22px rgba(14,22,48,.35);text-align:center">' +
          '<img src="icons/Icon-192.png" alt="" width="56" height="56" style="border-radius:14px;display:block;margin:0 auto 16px">' +
          '<div style="font-size:21px;font-weight:800;color:' + ink + ';margin-bottom:6px">ClassMate couldn\u2019t start</div>' +
          '<div style="margin-bottom:20px">Reload the page. If it keeps happening, email <a href="mailto:support@classmateapp.org" style="color:' + brand + '">support@classmateapp.org</a> with a screenshot of the details below.</div>' +
          '<button type="button" onclick="location.reload()" style="width:100%;height:48px;border:0;border-radius:13px;background:' + brand + ';color:' + brandInk + ';font-weight:700;font-size:16px;font-family:inherit;cursor:pointer">Reload</button>' +
          '<details style="margin-top:16px;text-align:start"><summary style="cursor:pointer;font-weight:600">Details</summary>' +
          '<pre id="cm-err-log" style="margin:10px 0 0;max-height:40vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,Menlo,monospace;color:' + ink + '"></pre></details></div>';
        (document.body || document.documentElement).appendChild(d);
        return d;
      }
      function show(msg) {
        // Only STARTUP errors — while the static splash is still up
        // (flutter_native_splash removes #splash on the first Flutter frame).
        // After that, an uncaught async error must not cover a running app;
        // Sentry captures those.
        if (!document.getElementById('splash')) return;
        panel();
        var log = document.getElementById('cm-err-log');
        log.textContent += (log.textContent ? '\n\n' : '') + msg;
      }
      window.addEventListener('error', function (e) {
        show('[error] ' + (e.message || '') + '\n' + (((e.error && e.error.stack) || (e.filename + ':' + e.lineno + ':' + e.colno)) || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('[promise] ' + ((r && (r.stack || r.message)) || String(r)));
      });
      window.__cmShowError = show;
    })();
  </script>

  
  
  
  
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
