services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: classmate
      POSTGRES_PASSWORD: classmate_pw
      POSTGRES_DB: classmate
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ghcr.io/YOUR_GH_USER/classmate-api:pilot
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://classmate:classmate_pw@db:5432/classmate
      JWT_SECRET: CHANGE_ME_LONG_RANDOM
      PORT: 3000
      # CORS_ORIGIN: https://pilot.classmate.app
    depends_on:
      - db
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  dbdata:
